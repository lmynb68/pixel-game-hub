<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素贪吃蛇</title>
  <style>
    :root {
      --ink: #231f20;
      --cream: #fff3c4;
      --yellow: #ffe16a;
      --blue: #70d6ff;
      --green: #78c56f;
      --red: #f95f62;
      --panel: #2d2a32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(35, 31, 32, .08) 1px, transparent 1px),
        linear-gradient(rgba(35, 31, 32, .08) 1px, transparent 1px),
        linear-gradient(180deg, #f8e7a0, #f4b46d 52%, #c86f62);
      background-size: 18px 18px, 18px 18px, auto;
      font-family: "Courier New", "Microsoft YaHei", monospace;
      letter-spacing: 0;
      image-rendering: pixelated;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 18px;
      color: var(--cream);
      border: 4px solid var(--ink);
      background: var(--panel);
      box-shadow: 8px 8px 0 var(--ink);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--ink);
      border: 4px solid var(--ink);
      background: var(--green);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .back {
      min-height: 42px;
      padding: 0 16px;
      color: var(--ink);
      border: 4px solid var(--ink);
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 900;
      text-decoration: none;
    }

    .game-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    .board-panel,
    .side {
      border: 4px solid var(--ink);
      background: var(--cream);
      box-shadow: 8px 8px 0 var(--ink);
    }

    .board-panel {
      padding: 18px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 58px;
      padding: 10px;
      color: var(--cream);
      border: 4px solid var(--ink);
      background: var(--panel);
      font-weight: 900;
    }

    .stat strong {
      display: block;
      color: var(--yellow);
      font-size: 24px;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      background: #162d22;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(35, 31, 32, .72);
      color: var(--cream);
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      margin: 0 0 12px;
      color: var(--yellow);
      font-size: clamp(32px, 7vw, 64px);
      line-height: 1;
    }

    .overlay p {
      margin: 0;
      line-height: 1.7;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-weight: 700;
    }

    .side {
      padding: 18px;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0;
    }

    .controls button,
    .action {
      min-height: 48px;
      color: var(--ink);
      border: 4px solid var(--ink);
      background: var(--blue);
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 900;
    }

    .controls .blank {
      visibility: hidden;
    }

    .action {
      width: 100%;
      margin-top: 10px;
      background: var(--yellow);
    }

    .action.danger {
      background: var(--red);
    }

    .tips {
      margin-top: 18px;
      padding-left: 18px;
      color: #4d3836;
      line-height: 1.7;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .game-shell {
        grid-template-columns: 1fr;
      }

      .side {
        order: -1;
      }
    }

    @media (max-width: 560px) {
      .wrap {
        padding: 12px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .hud {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand"><span class="logo">SN</span><span>像素贪吃蛇</span></div>
      <a class="back" href="../../index.html">返回游戏厅</a>
    </header>

    <section class="game-shell">
      <section class="board-panel">
        <div class="hud" aria-label="游戏状态">
          <div class="stat">SCORE<strong id="score">0</strong></div>
          <div class="stat">BEST<strong id="best">0</strong></div>
          <div class="stat">SPEED<strong id="speed">1</strong></div>
        </div>
        <div class="canvas-wrap">
          <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
          <div class="overlay" id="overlay">
            <div>
              <h1 id="overlay-title">READY?</h1>
              <p id="overlay-text">按 START 开始。方向键 / WASD / 下方按钮都可以控制。</p>
            </div>
          </div>
        </div>
      </section>

      <aside class="side">
        <h2>玩法提示</h2>
        <ul class="tips">
          <li>吃到金币会变长，并获得 10 分。</li>
          <li>撞到墙壁或自己的身体，本局结束。</li>
          <li>分数越高，蛇的移动速度越快。</li>
          <li>电脑可用方向键或 WASD，手机可用下方按钮。</li>
          <li>暂停后再次点击 START 继续游戏。</li>
        </ul>

        <button class="action" id="start">START / PAUSE</button>
        <button class="action danger" id="restart">RESTART</button>

        <div class="controls" aria-label="方向控制">
          <span class="blank"></span>
          <button type="button" data-dir="up">↑</button>
          <span class="blank"></span>
          <button type="button" data-dir="left">←</button>
          <button type="button" data-dir="down">↓</button>
          <button type="button" data-dir="right">→</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const speedEl = document.querySelector("#speed");
    const overlay = document.querySelector("#overlay");
    const overlayTitle = document.querySelector("#overlay-title");
    const overlayText = document.querySelector("#overlay-text");
    const startButton = document.querySelector("#start");
    const restartButton = document.querySelector("#restart");
    const grid = 20;
    const cells = canvas.width / grid;
    const bestKey = "pixel-snake-best";

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let best;
    let tickMs;
    let timer;
    let running;
    let gameOver;

    function reset() {
      snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      tickMs = 150;
      running = false;
      gameOver = false;
      best = Number(localStorage.getItem(bestKey) || 0);
      food = createFood();
      updateHud();
      showOverlay("READY?", "按 START 开始。方向键 / WASD / 下方按钮都可以控制。");
      draw();
    }

    function createFood() {
      const freeCells = [];
      for (let x = 0; x < cells; x += 1) {
        for (let y = 0; y < cells; y += 1) {
          if (!snake.some((part) => part.x === x && part.y === y)) {
            freeCells.push({ x, y });
          }
        }
      }
      if (!freeCells.length) return null;
      return freeCells[Math.floor(Math.random() * freeCells.length)];
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      speedEl.textContent = Math.max(1, Math.floor((162 - tickMs) / 18) + 1);
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlay.classList.remove("hidden");
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
    }

    function startLoop() {
      if (gameOver) reset();
      running = true;
      hideOverlay();
      clearInterval(timer);
      timer = setInterval(step, tickMs);
    }

    function pauseLoop() {
      running = false;
      clearInterval(timer);
      showOverlay("PAUSED", "再按 START 继续。");
    }

    function restart() {
      clearInterval(timer);
      reset();
      startLoop();
    }

    function setDirection(name) {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const wanted = map[name];
      if (!wanted) return;
      if (wanted.x + direction.x === 0 && wanted.y + direction.y === 0) return;
      nextDirection = wanted;
    }

    function step() {
      direction = nextDirection;
      const head = snake[0];
      const next = { x: head.x + direction.x, y: head.y + direction.y };
      const grows = food && next.x === food.x && next.y === food.y;

      if (
        next.x < 0 ||
        next.y < 0 ||
        next.x >= cells ||
        next.y >= cells ||
        snake.some((part, index) => {
          const isTail = index === snake.length - 1;
          return !(isTail && !grows) && part.x === next.x && part.y === next.y;
        })
      ) {
        endGame();
        return;
      }

      snake.unshift(next);
      if (grows) {
        score += 10;
        if (score > best) {
          best = score;
          localStorage.setItem(bestKey, String(best));
        }
        if (score % 40 === 0 && tickMs > 72) {
          tickMs -= 12;
          clearInterval(timer);
          timer = setInterval(step, tickMs);
        }
        food = createFood();
        if (!food) {
          winGame();
          updateHud();
          draw();
          return;
        }
      } else {
        snake.pop();
      }

      updateHud();
      draw();
    }

    function endGame() {
      gameOver = true;
      running = false;
      clearInterval(timer);
      showOverlay("GAME OVER", `最终得分 ${score}。按 START 或 RESTART 再来一局。`);
    }

    function winGame() {
      gameOver = true;
      running = false;
      clearInterval(timer);
      showOverlay("YOU WIN", `整张地图都被你填满了，最终得分 ${score}。`);
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * grid + 2, y * grid + 2, grid - 4, grid - 4);
    }

    function draw() {
      ctx.fillStyle = "#162d22";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 243, 196, .08)";
      for (let i = 0; i <= cells; i += 1) {
        ctx.beginPath();
        ctx.moveTo(i * grid, 0);
        ctx.lineTo(i * grid, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * grid);
        ctx.lineTo(canvas.width, i * grid);
        ctx.stroke();
      }

      if (food) drawCell(food.x, food.y, "#ffe16a");
      snake.forEach((part, index) => drawCell(part.x, part.y, index === 0 ? "#70d6ff" : "#78c56f"));
    }

    startButton.addEventListener("click", () => {
      if (running) pauseLoop();
      else startLoop();
    });

    restartButton.addEventListener("click", restart);

    document.querySelector(".controls").addEventListener("click", (event) => {
      const button = event.target.closest("[data-dir]");
      if (button) setDirection(button.dataset.dir);
    });

    window.addEventListener("keydown", (event) => {
      const keys = {
        ArrowUp: "up",
        KeyW: "up",
        ArrowDown: "down",
        KeyS: "down",
        ArrowLeft: "left",
        KeyA: "left",
        ArrowRight: "right",
        KeyD: "right"
      };
      if (keys[event.code]) {
        event.preventDefault();
        setDirection(keys[event.code]);
      }
      if (event.code === "Space") {
        event.preventDefault();
        if (running) pauseLoop();
        else startLoop();
      }
    });

    reset();
  </script>
</body>
</html>
