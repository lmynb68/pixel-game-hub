<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Game Hub - 复古像素游戏厅</title>
  <style>
    :root {
      --bg: #17130f;
      --panel: rgba(28, 24, 18, .94);
      --panel-soft: rgba(42, 36, 27, .86);
      --line: rgba(255, 207, 104, .18);
      --line-bright: rgba(255, 207, 104, .36);
      --text: #fff4d4;
      --muted: #c9b88d;
      --mint: #70ffd7;
      --gold: #ffcf68;
      --gold-deep: #6a5128;
      --ink: #100d09;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 207, 104, .12), transparent 26%),
        radial-gradient(circle at 15% 88%, rgba(146, 48, 140, .2), transparent 30%),
        linear-gradient(120deg, rgba(70, 255, 215, .12), transparent 22%),
        #0e0c0a;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 26px;
      min-height: 100vh;
      padding: 26px;
    }

    .sidebar {
      position: sticky;
      top: 26px;
      align-self: start;
      min-height: calc(100vh - 52px);
      padding: 24px;
      border: 1px solid var(--line-bright);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: linear-gradient(180deg, rgba(28, 24, 18, .96), rgba(20, 15, 13, .94));
      box-shadow: 16px 0 44px rgba(0, 0, 0, .28);
    }

    .kicker {
      color: var(--mint);
      font-size: 15px;
      font-weight: 800;
    }

    h1,
    h2 {
      margin: 10px 0 0;
      color: var(--text);
      line-height: 1;
      font-weight: 900;
    }

    .sidebar h1 {
      font-size: clamp(30px, 4vw, 42px);
    }

    .stat-list {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .stat {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 244, 212, .04);
    }

    .stat span {
      color: var(--mint);
      font-weight: 800;
    }

    .stat strong {
      color: var(--text);
      font-size: 30px;
      line-height: 1;
    }

    .side-block {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px dashed var(--line);
    }

    .side-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-weight: 800;
    }

    .side-title strong {
      color: var(--text);
      font-size: 22px;
    }

    .recent-list {
      margin: 16px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hint {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 207, 104, .13), rgba(112, 255, 215, .08));
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .main {
      min-width: 0;
      padding: 4px 0 40px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      margin-bottom: 26px;
    }

    .toolbar h2 {
      font-size: clamp(34px, 5vw, 54px);
    }

    .toolbar p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 700;
    }

    .search-row {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .search {
      width: min(360px, 36vw);
      min-height: 46px;
      padding: 0 16px;
      color: var(--text);
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      background: rgba(28, 24, 18, .78);
      outline: none;
    }

    .random {
      min-height: 46px;
      padding: 0 18px;
      color: var(--ink);
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      font-weight: 900;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .filter {
      min-height: 50px;
      padding: 0 22px;
      color: var(--muted);
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      background: rgba(28, 24, 18, .78);
      font-size: 18px;
      font-weight: 800;
    }

    .filter.active {
      color: var(--text);
      background: rgba(255, 207, 104, .24);
      border-color: var(--gold);
      box-shadow: inset 0 0 0 1px rgba(255, 207, 104, .16);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 22px;
    }

    .game-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      border: 1px solid var(--line-bright);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(19, 17, 12, .96), rgba(12, 10, 7, .97));
      box-shadow: 0 18px 54px rgba(0, 0, 0, .22);
    }

    .cover {
      height: 178px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 58% 34%, var(--c1), transparent 16%),
        radial-gradient(circle at 42% 52%, var(--c2), transparent 20%),
        linear-gradient(135deg, var(--c3), #17130f 72%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .12) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, .1) 1px, transparent 1px);
      background-size: 14px 14px;
      opacity: .22;
    }

    .sprite {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 84px;
      height: 84px;
      transform: translate(-50%, -50%);
      background: var(--sprite, var(--gold));
      box-shadow:
        -28px 0 0 rgba(255, 244, 212, .8),
        28px 0 0 rgba(255, 244, 212, .8),
        0 -28px 0 rgba(255, 244, 212, .7),
        0 28px 0 rgba(0, 0, 0, .34);
      clip-path: polygon(50% 0, 90% 18%, 100% 60%, 66% 100%, 34% 100%, 0 60%, 10% 18%);
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 24px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-head h3 {
      margin: 0;
      color: var(--text);
      font-size: 25px;
      line-height: 1.2;
    }

    .status {
      flex: 0 0 auto;
      min-width: 84px;
      min-height: 40px;
      display: grid;
      place-items: center;
      color: var(--ink);
      border-radius: 999px;
      background: var(--gold);
      font-weight: 900;
    }

    .meta-row,
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .pill {
      min-height: 32px;
      padding: 5px 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 212, .04);
      font-size: 14px;
    }

    .pin {
      color: var(--ink);
      background: var(--gold);
      border-color: var(--gold);
      font-weight: 900;
    }

    .desc {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.65;
    }

    .card-spacer {
      flex: 1;
    }

    .activity {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-top: 22px;
      color: var(--muted);
      font-weight: 800;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .play,
    .video {
      min-height: 52px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
    }

    .play {
      color: var(--ink);
      border: 0;
      background: var(--gold);
    }

    .video {
      color: var(--text);
      border: 1px solid var(--line-bright);
      background: rgba(255, 244, 212, .04);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 36px;
      border: 1px dashed var(--line-bright);
      border-radius: 20px;
      color: var(--muted);
      background: rgba(28, 24, 18, .72);
      font-size: 20px;
    }

    @media (max-width: 1240px) {
      .app {
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .game-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      .sidebar {
        position: static;
        min-height: auto;
        border-radius: 24px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .search-row {
        justify-content: flex-start;
      }

      .search {
        width: 100%;
      }
    }

    @media (max-width: 620px) {
      .app {
        padding: 10px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .toolbar p {
        font-size: 16px;
      }

      .filter {
        min-height: 42px;
        padding: 0 14px;
        font-size: 15px;
      }

      .game-card {
        min-height: 500px;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="玩家状态">
      <div class="kicker">玩家状态</div>
      <h1>玩家状态台</h1>

      <div class="stat-list">
        <div class="stat"><span>已收录</span><strong id="total-count">0</strong></div>
        <div class="stat"><span>可试玩</span><strong id="playable-count">0</strong></div>
        <div class="stat"><span>开发中</span><strong id="building-count">0</strong></div>
      </div>

      <section class="side-block">
        <div class="side-title"><strong>最近游玩</strong><span id="recent-count">0 条记录</span></div>
        <ul class="recent-list" id="recent-list">
          <li>还没有游玩记录，先点一款试试。</li>
        </ul>
      </section>

      <section class="side-block">
        <div class="side-title"><strong>高频点击</strong><span id="top-click-label">等待统计</span></div>
        <div class="hint" id="preference-hint">点击任意卡片后，这里会记录你的偏好。</div>
      </section>
    </aside>

    <section class="main">
      <header class="toolbar">
        <div>
          <div class="kicker">作品陈列架</div>
          <h2 id="list-title">全部游戏</h2>
        </div>
        <div>
          <p>按类型筛选，或直接随机进入一款已上线作品。</p>
          <div class="search-row">
            <input class="search" id="search-input" type="search" placeholder="搜索游戏、类型、标签">
            <button class="random" id="random-button">随机开玩</button>
          </div>
        </div>
      </header>

      <nav class="filters" id="filters" aria-label="游戏类型筛选"></nav>
      <section class="game-grid" id="game-grid" aria-live="polite"></section>
    </section>
  </main>

  <script src="./games.js"></script>
  <script src="./app.js"></script>
</body>
</html>
