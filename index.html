<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>街机收藏馆 - 街机小馆营业中</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="desktop">
    <section class="top-window">
      <div class="titlebar">
        <span>街机收藏馆</span>
        <div class="lights"><span class="light"></span><span class="light"></span><span class="light"></span></div>
      </div>
      <div class="hero-copy">
        <div class="kicker">复古街机游戏厅</div>
        <h1>街机小馆营业中</h1>
        <p>挑一款小游戏开局，或者交给随机按钮。这里会慢慢收进更多有趣作品。</p>
        <button class="random hero-random" id="random-button">随机游戏</button>
      </div>
      <div class="status-dock" aria-label="玩家状态">
        <div class="stat"><span>馆藏游戏</span><strong id="total-count">0</strong></div>
        <div class="stat"><span>马上能玩</span><strong id="playable-count">0</strong></div>
        <div class="stat"><span>即将开放</span><strong id="building-count">0</strong></div>
      </div>
    </section>

    <section class="workspace">
      <aside class="launcher" aria-label="玩家记录">
        <div class="titlebar"><span>挑战记录</span><span>★</span></div>
        <div class="launcher-body">
          <section class="side-block">
            <div class="side-title"><strong>最近开局</strong><span id="recent-count">0 次</span></div>
            <ul class="recent-list" id="recent-list">
              <li>还没有开局记录，先挑一款试试。</li>
            </ul>
          </section>

          <section class="side-block">
            <div class="side-title"><strong>常玩游戏</strong><span id="top-click-label">暂无记录</span></div>
            <div class="hint" id="preference-hint">还没有常玩游戏，先挑一款开局。</div>
          </section>
        </div>
      </aside>

      <section class="folder-window">
        <div class="titlebar"><span>街机游戏架</span><span id="folder-count">0 款</span></div>
        <div class="window-body">
          <header class="toolbar">
            <div>
              <div class="kicker">本店游戏单</div>
              <h2 id="list-title">全部游戏</h2>
              <p>用分类按钮筛选街机类型，或搜索游戏名、玩法和标签。</p>
            </div>
            <form class="search-row" id="search-form" role="search">
              <input class="search" id="search-input" type="search" placeholder="搜索游戏、玩法、标签">
              <button class="search-submit" type="submit">搜索</button>
            </form>
          </header>

          <nav class="filters" id="filters" aria-label="游戏类型筛选"></nav>
          <section class="game-grid" id="game-grid" aria-live="polite"></section>
        </div>
      </section>
    </section>
  </main>

  <footer class="taskbar">
    <span class="start-chip">投币</span>
    <span class="task-chip">街机大厅</span>
    <span class="task-chip">营业中</span>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
